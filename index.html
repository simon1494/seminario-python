<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>

    <!-- UIkit -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.19.3/dist/css/uikit.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.19.3/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.19.3/dist/js/uikit-icons.min.js"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tus scripts -->
    <script src="scripts.js" defer></script>
</head>

<body>

<div class="uk-section uk-section-default">
    <div class="uk-container uk-container-small">

        <h1 class="uk-heading-medium uk-text-center">Formulario de Contacto</h1>

        <form id="form-contacto" class="uk-form-stacked" onsubmit="guardarDatos(event)">

            <div class="uk-margin">
                <label class="uk-form-label">Nombre</label>
                <div class="uk-form-controls">
                    <input id="nombre" class="uk-input" type="text" required>
                </div>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label">Apellido</label>
                <div class="uk-form-controls">
                    <input id="apellido" class="uk-input" type="text" required>
                </div>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label">Correo</label>
                <div class="uk-form-controls">
                    <input id="correo" class="uk-input" type="email" required>
                </div>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label">Teléfono</label>
                <div class="uk-form-controls">
                    <input id="telefono" class="uk-input" type="number" required>
                </div>
            </div>

            <div class="uk-margin uk-text-center">
                <button class="uk-button uk-button-primary uk-width-1-2">
                    Enviar
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
